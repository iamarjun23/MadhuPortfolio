<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SaveBar placement test</title>
    <link rel="stylesheet" href="/_savebar-test.css" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #06080a;
      }
      .rig {
        display: grid;
        gap: 28px;
        grid-template-columns: 383px 460px;
        align-items: start;
      }
      .rig > div > p {
        margin: 0 0 8px;
        color: #8aa;
        font: 12px monospace;
      }
      /* The panel is normally full height and sticky; clip it to just the header. */
      .studio-ins {
        position: static;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="rig">
      <div>
        <p>383px (screenshot width) — dirty</p>
        <aside class="studio-ins" aria-label="Editing panel">
          <header class="studio-ins__head">
            <div class="studio-ins__headline">
              <div class="studio-ins__title">
                <span>Editing</span>
                <h2>Hero</h2>
              </div>
              <section class="studio-save-bar" aria-label="Draft changes">
                <div class="studio-save-bar__copy">
                  <span>Draft changes</span>
                  <p><strong>Hero</strong> is ready to save.</p>
                  <small
                    >Save this section first, then publish all saved changes from the top
                    bar.</small
                  >
                </div>
                <div>
                  <button class="button button--ghost" type="button">Undo</button>
                  <button class="button button--primary" type="button">Save section</button>
                </div>
              </section>
            </div>
            <div class="studio-ins__tabs" role="tablist" aria-label="Panel view">
              <button type="button" role="tab" class="is-active">Content</button>
              <button type="button" role="tab">Photos &amp; video <span>1</span></button>
            </div>
          </header>
        </aside>
      </div>

      <div>
        <p>460px (desktop panel) — clean (SaveBar absent)</p>
        <aside class="studio-ins" aria-label="Editing panel">
          <header class="studio-ins__head">
            <div class="studio-ins__headline">
              <div class="studio-ins__title">
                <span>Editing</span>
                <h2>Drawing Room</h2>
              </div>
            </div>
            <div class="studio-ins__tabs" role="tablist" aria-label="Panel view">
              <button type="button" role="tab" class="is-active">Content</button>
              <button type="button" role="tab">Photos &amp; video <span>4</span></button>
            </div>
          </header>
        </aside>
      </div>
    </div>
  </body>
</html>
